[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "limit-pullback"
version = "0.1.0"
description = "A-share post-market limit-up pullback pure strategy engine"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
integration = [
  "akshare>=1.18,<2",
  "baostock>=0.9.3,<1",
]
warehouse = [
  "duckdb>=1.1,<2",
  "pyarrow>=17,<21",
  "pytz>=2024.1",
  "tushare>=1.2,<2",
]
test = [
  "pytest>=8.3,<9",
]
# Minimal deps for cloud CI research-contract tests (no provider/warehouse).
ci = [
  "pytest>=8.3,<9",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/limit_pullback"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: explicitly enabled tests that access fixed real-data providers",
  "cloud_ci: deterministic tests safe on GitHub-hosted runners; no local market database required",
  "local_data: requires Mac-local frozen/canonical/ASL artifacts",
]
