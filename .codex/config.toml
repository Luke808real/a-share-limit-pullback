sandbox_mode = "danger-full-access"

[agents]
max_threads = 4
max_depth = 1

[agents.code-reader]
description = "Read-only code and test inspection."
config_file = "agents/code-reader.toml"

[agents.data-reader]
description = "Read-only data, fixture, and provenance inspection."
config_file = "agents/data-reader.toml"

[agents.adversarial-reviewer]
description = "Read-only adversarial review before final validation."
config_file = "agents/adversarial-reviewer.toml"

[agents.research-strategy]
description = "Strategy hypothesis research, backtest protocol design, study execution."
config_file = "agents/research-strategy.toml"

[agents.data-processing]
description = "Provenance, lineage, coverage and reconciliation inspection."
config_file = "agents/data-processing.toml"

[agents.news-analysis]
description = "News/announcement observation layer: ASL ingestion and daily briefs."
config_file = "agents/news-analysis.toml"

[agents.performance]
description = "Pipeline profiling, timing budgets, golden-equivalence checks."
config_file = "agents/performance.toml"
