name: cloud-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci]"
      - name: Compile research and source modules
        run: python -m compileall -q src research/second_launch/factors_v01
      - name: Research contract tests (cloud_ci, no local data)
        run: |
          python -m pytest \
            tests/test_r5a_benchmark_contract_v01.py \
            tests/test_r5b_benchmark_execution_v01.py \
            tests/test_r6a_incremental_contract_v01.py \
            tests/test_r6b_incremental_execution_v01.py \
            tests/test_r7a_multivariate_contract_v01.py \
            tests/test_r7b_multivariate_execution_v01.py \
            tests/test_r8a_intraday_acceptance_contract_v01.py \
            tests/test_r8a_asl5m_readiness_v01.py \
            -m "cloud_ci and not local_data"
